<style>
  :root {
    --bg: #12151c;
    --panel: #1a1f28;
    --panel-raised: #202632;
    --line-thin: #2b3240;
    --line-thick: #4b5566;
    --given: #e9e5d8;
    --entered: #7fb0dd;
    --entered-dim: #5f8ab3;
    --accent: #c99a3d;
    --accent-soft: #35301f;
    --error: #c1554a;
    --error-soft: #3a2320;
    --peer: #1e2530;
    --same-num: #253142;
    --selected: #2c3a4d;
    --notes: #6b7688;
    --muted: #7a8394;
    --border-radius: 3px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--given);
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
  }

  .app {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    text-align: center;
    margin-bottom: 22px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 2.1rem;
    margin: 0;
    letter-spacing: 0.01em;
    color: var(--given);
  }

  .tagline {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 0.92rem;
    color: var(--muted);
    margin-top: 6px;
  }

  .difficulty-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-bottom: 18px;
  }

  .diff-btn {
    font-family: 'Inter', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--line-thin);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }

  .diff-btn:hover { border-color: var(--line-thick); color: var(--given); }

  .diff-btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }

  .status-line {
    min-height: 22px;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 10px;
    text-align: center;
  }

  .status-line.solved { color: var(--accent); font-weight: 500; }
  .status-line.generating { color: var(--muted); }

  .board-wrap {
    position: relative;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 1 / 1;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    width: 100%;
    height: 100%;
    background: var(--panel);
    border: 2px solid var(--line-thick);
    border-radius: 4px;
    overflow: hidden;
    transition: opacity 0.2s ease;
  }

  .board.dim { opacity: 0.35; pointer-events: none; }

  .cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(1rem, 4.4vw, 1.35rem);
    font-weight: 500;
    color: var(--entered);
    background: var(--panel);
    border: 0.5px solid var(--line-thin);
    cursor: pointer;
    user-select: none;
  }

  .cell.given { color: var(--given); font-weight: 500; cursor: default; }

  .cell:nth-child(3n) { border-right: 1.5px solid var(--line-thick); }
  .cell:nth-child(9n+1) { border-left: 1.5px solid var(--line-thick); }
  .cell:nth-child(n+1):nth-child(-n+9) { border-top: 1.5px solid var(--line-thick); }
  .row-block-bottom { border-bottom: 1.5px solid var(--line-thick) !important; }

  .cell.peer { background: var(--peer); }
  .cell.same-num { background: var(--same-num); }
  .cell.selected { background: var(--selected); }
  .cell.error { color: var(--error); }
  .cell.error.given { color: var(--error); }

  .cell.selected::after {
    content: '';
    position: absolute;
    inset: 0;
    box-shadow: inset 0 0 0 1.5px var(--accent);
    pointer-events: none;
  }

  .notes-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    width: 100%;
    height: 100%;
    padding: 3px;
  }

  .notes-grid span {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    font-size: clamp(0.5rem, 1.6vw, 0.62rem);
    color: var(--notes);
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 18px;
    width: 100%;
    max-width: 420px;
  }

  .ctrl-btn {
    flex: 1;
    font-family: 'Inter', sans-serif;
    font-size: 0.78rem;
    font-weight: 500;
    padding: 10px 6px;
    border-radius: var(--border-radius);
    border: 1px solid var(--line-thin);
    background: var(--panel);
    color: var(--muted);
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .ctrl-btn:hover { border-color: var(--line-thick); color: var(--given); }
  .ctrl-btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .ctrl-btn:disabled { opacity: 0.4; cursor: default; }

  .numpad {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 6px;
    margin-top: 12px;
    width: 100%;
    max-width: 420px;
  }

  .num-btn {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.05rem;
    font-weight: 500;
    padding: 12px 0;
    border-radius: var(--border-radius);
    border: 1px solid var(--line-thin);
    background: var(--panel);
    color: var(--entered);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .num-btn:hover { border-color: var(--accent); }
  .num-btn:disabled { opacity: 0.25; cursor: default; }

  .new-puzzle {
    margin-top: 20px;
    font-family: 'Inter', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    padding: 11px 22px;
    border-radius: var(--border-radius);
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .new-puzzle:hover { background: var(--accent-soft); }

  @media (max-width: 400px) {
    .difficulty-row { gap: 5px; }
    .diff-btn { padding: 6px 9px; font-size: 0.72rem; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Sudoku</h1>
    <div class="tagline">six shades of difficulty, no clock watching</div>
  </header>

  <div class="difficulty-row" id="difficultyRow"></div>
  <div class="status-line" id="statusLine"></div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="undoBtn">Undo</button>
    <button class="ctrl-btn" id="eraseBtn">Erase</button>
    <button class="ctrl-btn" id="notesBtn">Notes</button>
    <button class="ctrl-btn" id="checkBtn">Check</button>
  </div>

  <div class="numpad" id="numpad"></div>

  <button class="new-puzzle" id="newPuzzleBtn">New puzzle</button>
</div>

<script>
// ---------- Sudoku core: solver + unique-solution generator ----------

function rowOf(i) { return Math.floor(i / 9); }
function colOf(i) { return i % 9; }
function boxOf(i) { return Math.floor(rowOf(i) / 3) * 3 + Math.floor(colOf(i) / 3); }

function candidatesFor(board, i) {
  if (board[i] !== 0) return [];
  const r = rowOf(i), c = colOf(i), b = boxOf(i);
  const used = new Set();
  for (let k = 0; k < 9; k++) {
    used.add(board[r * 9 + k]);
    used.add(board[k * 9 + c]);
    const br = Math.floor(b / 3) * 3 + Math.floor(k / 3);
    const bc = (b % 3) * 3 + (k % 3);
    used.add(board[br * 9 + bc]);
  }
  const out = [];
  for (let n = 1; n <= 9; n++) if (!used.has(n)) out.push(n);
  return out;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function countSolutions(board, limit, solutionOut) {
  let count = 0;
  function backtrack(b) {
    if (count >= limit) return;
    let bestIdx = -1, bestCands = null;
    for (let i = 0; i < 81; i++) {
      if (b[i] === 0) {
        const cands = candidatesFor(b, i);
        if (cands.length === 0) return;
        if (bestCands === null || cands.length < bestCands.length) {
          bestIdx = i; bestCands = cands;
          if (cands.length === 1) break;
        }
      }
    }
    if (bestIdx === -1) {
      count++;
      if (solutionOut && solutionOut.length === 0) for (let k = 0; k < 81; k++) solutionOut.push(b[k]);
      return;
    }
    for (const n of bestCands) {
      if (count >= limit) return;
      b[bestIdx] = n;
      backtrack(b);
      b[bestIdx] = 0;
    }
  }
  backtrack(board.slice());
  return count;
}

function generateFullSolution() {
  const board = new Array(81).fill(0);
  function fill(b) {
    let idx = -1;
    for (let i = 0; i < 81; i++) { if (b[i] === 0) { idx = i; break; } }
    if (idx === -1) return true;
    const cands = shuffle(candidatesFor(b, idx));
    for (const n of cands) {
      b[idx] = n;
      if (fill(b)) return true;
      b[idx] = 0;
    }
    return false;
  }
  fill(board);
  return board;
}

const DIFFICULTY_CLUES = { easy: 38, medium: 32, hard: 28, expert: 25, master: 23, extreme: 20 };
const DIFFICULTY_LABELS = { easy: 'Easy', medium: 'Medium', hard: 'Hard', expert: 'Expert', master: 'Master', extreme: 'Extreme' };

function digPass(solution, targetClues) {
  const puzzle = solution.slice();
  const cellOrder = shuffle([...Array(81).keys()]);
  let clues = 81;
  for (const idx of cellOrder) {
    if (clues <= targetClues) break;
    if (puzzle[idx] === 0) continue;
    const backup = puzzle[idx];
    puzzle[idx] = 0;
    const solCount = countSolutions(puzzle, 2, []);
    if (solCount !== 1) puzzle[idx] = backup;
    else clues--;
  }
  return { puzzle, clues };
}

function generatePuzzle(difficulty) {
  const targetClues = DIFFICULTY_CLUES[difficulty] ?? 32;
  const startTime = Date.now();
  const timeBudgetMs = 2600;
  const maxAttempts = 15;
  let best = null;
  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    const solution = generateFullSolution();
    for (let p = 0; p < 3; p++) {
      const { puzzle, clues } = digPass(solution, targetClues);
      if (best === null || clues < best.clues) best = { puzzle, solution, clues };
      if (best.clues <= targetClues) break;
      if (Date.now() - startTime > timeBudgetMs) break;
    }
    if (best.clues <= targetClues) break;
    if (Date.now() - startTime > timeBudgetMs) break;
  }
  return best;
}

// ---------- Game state ----------

let state = {
  difficulty: 'medium',
  givens: null,       // 81-array, 0 = empty, fixed clues
  solution: null,      // 81-array, full solution
  grid: null,           // 81-array, current values (0 = empty)
  notes: null,          // array of 81 Sets
  selected: null,
  notesMode: false,
  history: [],
};

function cloneGrid(g) { return g.slice(); }
function cloneNotes(n) { return n.map(s => new Set(s)); }

function pushHistory() {
  state.history.push({ grid: cloneGrid(state.grid), notes: cloneNotes(state.notes) });
  if (state.history.length > 200) state.history.shift();
}

function newGame(difficulty) {
  state.difficulty = difficulty;
  renderDifficultyRow();
  setStatus('Shaping a new ' + DIFFICULTY_LABELS[difficulty].toLowerCase() + ' puzzle…', 'generating');
  document.getElementById('board').classList.add('dim');
  disableControls(true);

  setTimeout(() => {
    const { puzzle, solution } = generatePuzzle(difficulty);
    state.givens = puzzle;
    state.solution = solution;
    state.grid = puzzle.slice();
    state.notes = new Array(81).fill(null).map(() => new Set());
    state.selected = null;
    state.notesMode = false;
    state.history = [];
    document.getElementById('notesBtn').classList.remove('on');
    document.getElementById('board').classList.remove('dim');
    disableControls(false);
    setStatus('', '');
    renderBoard();
    renderNumpad();
  }, 40);
}

function disableControls(disabled) {
  ['undoBtn','eraseBtn','notesBtn','checkBtn'].forEach(id => {
    document.getElementById(id).disabled = disabled;
  });
  document.querySelectorAll('.num-btn').forEach(b => b.disabled = disabled);
}

function setStatus(text, cls) {
  const el = document.getElementById('statusLine');
  el.textContent = text;
  el.className = 'status-line' + (cls ? ' ' + cls : '');
}

// ---------- Rendering ----------

function renderDifficultyRow() {
  const row = document.getElementById('difficultyRow');
  row.innerHTML = '';
  Object.keys(DIFFICULTY_CLUES).forEach(diff => {
    const btn = document.createElement('button');
    btn.className = 'diff-btn' + (diff === state.difficulty ? ' active' : '');
    btn.textContent = DIFFICULTY_LABELS[diff];
    btn.addEventListener('click', () => {
      if (diff !== state.difficulty || confirm('Start a new ' + DIFFICULTY_LABELS[diff] + ' puzzle? Current progress will be lost.')) {
        newGame(diff);
      }
    });
    row.appendChild(btn);
  });
}

function hasConflict(idx) {
  const val = state.grid[idx];
  if (val === 0) return false;
  const r = rowOf(idx), c = colOf(idx), b = boxOf(idx);
  for (let k = 0; k < 9; k++) {
    const ri = r * 9 + k;
    const ci = k * 9 + c;
    const br = Math.floor(b / 3) * 3 + Math.floor(k / 3);
    const bc = (b % 3) * 3 + (k % 3);
    const bi = br * 9 + bc;
    if (ri !== idx && state.grid[ri] === val) return true;
    if (ci !== idx && state.grid[ci] === val) return true;
    if (bi !== idx && state.grid[bi] === val) return true;
  }
  return false;
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const selVal = state.selected !== null ? state.grid[state.selected] : 0;

  for (let i = 0; i < 81; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    if (rowOf(i) % 3 === 2 && rowOf(i) !== 8) cell.classList.add('row-block-bottom');
    if (state.givens[i] !== 0) cell.classList.add('given');

    const r = rowOf(i), c = colOf(i), b = boxOf(i);
    if (state.selected !== null) {
      const sr = rowOf(state.selected), sc = colOf(state.selected), sb = boxOf(state.selected);
      if (r === sr || c === sc || b === sb) cell.classList.add('peer');
      if (i === state.selected) cell.classList.add('selected');
    }
    if (selVal !== 0 && state.grid[i] === selVal) cell.classList.add('same-num');
    if (hasConflict(i)) cell.classList.add('error');

    if (state.grid[i] !== 0) {
      cell.textContent = state.grid[i];
    } else if (state.notes[i].size > 0) {
      const ng = document.createElement('div');
      ng.className = 'notes-grid';
      for (let n = 1; n <= 9; n++) {
        const span = document.createElement('span');
        span.textContent = state.notes[i].has(n) ? n : '';
        ng.appendChild(span);
      }
      cell.appendChild(ng);
    }

    cell.addEventListener('click', () => selectCell(i));
    board.appendChild(cell);
  }
}

function renderNumpad() {
  const pad = document.getElementById('numpad');
  pad.innerHTML = '';
  for (let n = 1; n <= 9; n++) {
    const btn = document.createElement('button');
    btn.className = 'num-btn';
    btn.textContent = n;
    btn.addEventListener('click', () => inputNumber(n));
    pad.appendChild(btn);
  }
}

// ---------- Interaction ----------

function selectCell(i) {
  state.selected = i;
  renderBoard();
}

function inputNumber(n) {
  if (state.selected === null) return;
  const idx = state.selected;
  if (state.givens[idx] !== 0) return;

  pushHistory();

  if (state.notesMode) {
    if (state.grid[idx] !== 0) { state.history.pop(); return; }
    if (state.notes[idx].has(n)) state.notes[idx].delete(n);
    else state.notes[idx].add(n);
  } else {
    state.grid[idx] = state.grid[idx] === n ? 0 : n;
    state.notes[idx].clear();
    if (state.grid[idx] !== 0) {
      // clear this number from notes of peers for convenience
      const r = rowOf(idx), c = colOf(idx), b = boxOf(idx);
      for (let k = 0; k < 81; k++) {
        if (rowOf(k) === r || colOf(k) === c || boxOf(k) === b) state.notes[k].delete(n);
      }
    }
  }
  renderBoard();
  checkWin();
}

function eraseCell() {
  if (state.selected === null) return;
  const idx = state.selected;
  if (state.givens[idx] !== 0) return;
  pushHistory();
  state.grid[idx] = 0;
  state.notes[idx].clear();
  renderBoard();
}

function undo() {
  if (state.history.length === 0) return;
  const prev = state.history.pop();
  state.grid = prev.grid;
  state.notes = prev.notes;
  renderBoard();
}

function toggleNotes() {
  state.notesMode = !state.notesMode;
  document.getElementById('notesBtn').classList.toggle('on', state.notesMode);
}

function checkPuzzle() {
  let filled = true;
  let anyConflict = false;
  for (let i = 0; i < 81; i++) {
    if (state.grid[i] === 0) filled = false;
    if (hasConflict(i)) anyConflict = true;
  }
  if (anyConflict) {
    setStatus('There are conflicting numbers on the board.', 'error');
  } else if (filled) {
    setStatus('Solved — every number checks out.', 'solved');
  } else {
    setStatus('No conflicts so far. Keep going.', '');
  }
}

function checkWin() {
  for (let i = 0; i < 81; i++) {
    if (state.grid[i] === 0 || state.grid[i] !== state.solution[i]) return;
  }
  setStatus('Solved — well played.', 'solved');
}

// ---------- Keyboard ----------

document.addEventListener('keydown', (e) => {
  if (state.selected === null) {
    if (e.key >= '1' && e.key <= '9') return;
  }
  if (e.key >= '1' && e.key <= '9') {
    inputNumber(parseInt(e.key, 10));
    return;
  }
  if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
    eraseCell();
    return;
  }
  if (state.selected === null) return;
  const r = rowOf(state.selected), c = colOf(state.selected);
  let nr = r, nc = c;
  if (e.key === 'ArrowUp') nr = Math.max(0, r - 1);
  else if (e.key === 'ArrowDown') nr = Math.min(8, r + 1);
  else if (e.key === 'ArrowLeft') nc = Math.max(0, c - 1);
  else if (e.key === 'ArrowRight') nc = Math.min(8, c + 1);
  else return;
  e.preventDefault();
  selectCell(nr * 9 + nc);
});

// ---------- Wire up ----------

document.getElementById('undoBtn').addEventListener('click', undo);
document.getElementById('eraseBtn').addEventListener('click', eraseCell);
document.getElementById('notesBtn').addEventListener('click', toggleNotes);
document.getElementById('checkBtn').addEventListener('click', checkPuzzle);
document.getElementById('newPuzzleBtn').addEventListener('click', () => newGame(state.difficulty));

newGame('medium');

// Register service worker for offline/installable support (PWA).
// Guarded so this file still runs fine when opened directly via file://
// or wrapped in Electron, where a service worker isn't needed/available.
if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
